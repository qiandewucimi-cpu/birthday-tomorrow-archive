name: Bug 报告
description: 使用完全虚构的数据报告可复现的问题。
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        请勿提交真实姓名、客户内容、访问口令、私人 URL、本机绝对路径或未经处理的截图。安全问题请使用仓库的私密漏洞报告入口。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认本报告只包含虚构或已脱敏的数据。
          required: true
        - label: 我确认这不是需要私密披露的安全漏洞。
          required: true
  - type: dropdown
    id: mode
    attributes:
      label: 产品模式
      options:
        - demo
        - studio
        - recipient（仅描述虚构复现）
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: 版本或提交
      placeholder: 例如 main / abc1234
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请使用内置虚构 demo 或最小虚构实例。
      placeholder: |
        1. 运行……
        2. 打开……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 11 / Chrome / Node 22 / pnpm 11.19.0
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏证据
      description: 可选。上传前检查截图、日志和构建路径。
