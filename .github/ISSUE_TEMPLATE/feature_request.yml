name: 功能建议
description: 提议一个符合隐私边界的产品改进。
title: "[Feature] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        请描述通用需求，不要粘贴真实客户故事、媒体、URL、口令或身份信息。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认本建议不包含真实客户或个人隐私数据。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 用户在什么场景下遇到了什么困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的交互、输入和输出。
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 成品阅读体验
        - 制作台
        - 实例格式
        - 隐私与交付
        - 构建与开发体验
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 隐私、兼容性或迁移风险
      description: 说明是否影响旧实例、recipient 构建或客户数据边界。
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
